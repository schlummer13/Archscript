{{ define "main" }}

<main class="mx-auto grid min-h-[calc(100vh-160px)] w-full max-w-[1200px] place-items-center px-8 py-20 max-[640px]:px-4">
  <section class="w-full border border-[var(--border-strong)] bg-[var(--surface)] p-8">
    <p class="mb-5 text-xs font-semibold uppercase tracking-[0.45em] text-[var(--muted)]">
      Error / 404
    </p>

    <h1 class="max-w-[860px] text-[clamp(56px,8vw,120px)] font-semibold leading-[0.9] tracking-[-0.08em]">
      Page not found.
    </h1>

    <p class="mt-8 max-w-[620px] text-lg leading-8 text-[var(--muted)]">
      The page you requested does not exist or has been moved.
    </p>

    <div class="mt-10 flex flex-wrap gap-3">
      <a
        href="/"
        class="inline-flex border border-[var(--border-strong)] bg-[var(--text)] px-5 py-3 text-[11px] font-semibold uppercase tracking-[0.16em] text-[var(--bg)]"
      >
        Back Home
      </a>

      <a
        href="/playground/"
        class="inline-flex border border-[var(--border-strong)] bg-[var(--surface)] px-5 py-3 text-[11px] font-semibold uppercase tracking-[0.16em] text-[var(--text)] transition-colors hover:bg-[var(--text)] hover:text-[var(--bg)]"
      >
        Open Playground
      </a>
    </div>
  </section>
</main>

{{ end }}
