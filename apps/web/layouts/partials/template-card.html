<article class="group border border-[var(--border)] bg-[var(--surface)] p-6 transition-colors hover:border-[var(--border-strong)]">
  <div class="mb-8 flex items-start justify-between gap-6">
    <p class="text-[11px] font-bold uppercase tracking-[0.22em] text-[var(--muted)]">
      {{ .label }}
    </p>

    <span class="text-[11px] font-bold uppercase tracking-[0.18em] text-[var(--muted)]">
      {{ .number }}
    </span>
  </div>

  <h2 class="text-2xl font-semibold tracking-[-0.04em]">
    {{ .title }}
  </h2>

  <p class="mt-4 leading-7 text-[var(--muted)]">
    {{ .text }}
  </p>

  <div class="mt-8 border-t border-[var(--border)] pt-5">
    <p class="text-[11px] font-bold uppercase tracking-[0.18em] text-[var(--muted)]">
      Best for
    </p>

    <p class="mt-2 text-sm leading-6">
      {{ .bestFor }}
    </p>
  </div>

  <div class="mt-5 border-t border-[var(--border)] pt-5">
    <p class="text-[11px] font-bold uppercase tracking-[0.18em] text-[var(--muted)]">
      Includes
    </p>

    <p class="mt-2 text-sm leading-6">
      {{ .includes }}
    </p>
  </div>
</article>
