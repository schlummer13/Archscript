<header
  class="
    sticky top-0 z-50
    grid grid-cols-[240px_1fr_240px]
    items-center
    min-h-16
    px-8
    border-b border-[var(--border-strong)]
    bg-[color-mix(in_srgb,var(--bg)_92%,transparent)]
    backdrop-blur-xl
    max-[1100px]:grid-cols-1
    max-[1100px]:gap-4
    max-[1100px]:py-4
    max-[1100px]:px-6
  "
>
  <a href="/" class="flex flex-col gap-0.5">
    <span
      class="
        text-xs font-extrabold
        tracking-[0.22em]
        uppercase
      "
    >
      ARCHSCRIPT
    </span>

    <span
      class="
        text-[10px]
        tracking-[0.18em]
        uppercase
        text-[var(--muted)]
      "
    >
      ARCHITECTURE AS CODE
    </span>
  </a>

  <nav
    class="
      flex justify-center gap-8
      max-[1100px]:justify-start
      max-[1100px]:flex-wrap
    "
  >
    <a
      href="/playground/"
      class="
        text-[11px]
        tracking-[0.18em]
        uppercase
        hover:text-[var(--muted)]
      "
    >
      Playground
    </a>

    <a
      href="/docs/"
      class="
        text-[11px]
        tracking-[0.18em]
        uppercase
        hover:text-[var(--muted)]
      "
    >
      Documentation
    </a>

    <a
      href="/templates/"
      class="
        text-[11px]
        tracking-[0.18em]
        uppercase
        hover:text-[var(--muted)]
      "
    >
      Templates
    </a>
  </nav>

  <div
    class="
      flex items-center justify-end gap-3.5
      max-[1100px]:justify-start
    "
  >
    <div
      class="
        text-[11px]
        tracking-[0.18em]
        uppercase
        whitespace-nowrap
      "
    >
      SYSTEM / V0.9
    </div>

    <button
  id="theme-toggle"
  class="
    inline-flex items-center gap-2
    border border-[var(--border-strong)]
    bg-[var(--surface)]
    px-3 py-2
    text-[10px] font-semibold
    uppercase tracking-[0.16em]
    transition-colors
    hover:bg-[var(--text)]
    hover:text-[var(--bg)]
  "
  aria-label="Toggle color theme"
>
  <span id="theme-toggle-icon">○</span>
  <span id="theme-toggle-label">Theme</span>
</button>
  </div>
</header>
