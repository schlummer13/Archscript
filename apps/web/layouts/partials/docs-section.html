<section id="{{ .id }}" class="border border-[var(--border-strong)] bg-[var(--surface)]">
  <div class="border-b border-[var(--border)] p-6">
    <h2 class="text-3xl font-semibold tracking-[-0.05em]">
      {{ .title }}
    </h2>

    <p class="mt-4 max-w-[760px] leading-7 text-[var(--muted)]">
      {{ .text }}
    </p>
  </div>

  <pre class="overflow-auto bg-[var(--surface-soft)] p-6 font-mono text-xs leading-7 whitespace-pre-wrap">{{ .code }}</pre>
</section>
