baseURL: "https://archscript.dev/"
title: "ArchScript"
locale: "en-US"

enableRobotsTXT: true
enableGitInfo: false

disableKinds:
  - taxonomy
  - term

sitemap:
  changefreq: "weekly"
  priority: 0.8
